# Benchmark scenario S1 (PLAN.md V00 step 1, CR12). S2 = S1 with max_output=60 (tests/benchmark/scenario.py).
# Synthetic data only: every company domain is *-example.de. The only real domains are the free-mail
# providers of the F elements (gmx.de, web.de; never contacted) and the directory links of the mocked
# search results (gelbeseiten.de; filtered before any crawl, never contacted).
#
# One Overpass slice (Bremen × Logistik), 46 Overpass elements in this order: N×16, F×2, W×24, E×4,
# plus K×6 web-only companies that are NOT in OSM (only in the mocked discovery SERP).
#   N  name + addr:postcode + addr:city, no website
#      variant guess  → the domain guessed from the name resolves (V13)
#      variant search → only the mocked lookup search finds it (SERP = directory link + company site; V12)
#      variant decoy  → search/guess lead to a same-name site with another postcode + city → must be rejected
#   F  free-mail `email` tag only → never a website (VQ9)
#   W  `website` tag; `variant` = how the email appears on the site
#   E  company-domain `email` tag only; the site exists and its Impressum matches name + postcode (V10)
#   K  web-only (V14b): 3 recoverable (in-area legal address in the gazetteer, legal name, industry
#      keywords); 3 decoys (out-of-area legal postcode; postcode only in a footer branch list;
#      non-industry site)
# Ground truth: expect_website / expect_email (null = nothing correct can be returned for it);
# `decoy: true` marks the 6 sites that must never be accepted.
# addr:postcode defaults to 28195 + 2 × (position − 1), addr:city to Bremen (scenario.py).
#
# Recoverable (correct email + website), CR12:
#   default (search on) 42 = 22 W (24 − 2 noemail) + 4 E + 5 guess + 8 search + 3 K
#   off (WEB_SEARCH_URL=off) 31 = 22 W + 4 E + 5 guess
# Decoys: 6 (3 lookup decoys among N, 3 web decoys among K).
name: S1
request:
  country: Germany
  regions: [Bremen]
  industries: [Logistik]
  information: [company_name, company_email, website]
  max_output: 20
env:
  CRAWLER_PER_DOMAIN_DELAY_S: "0.2"
site_latency_s: 0.02
overpass_latency_s: 0.2
recoverable: {default: 42, "off": 31}
decoys: 6
