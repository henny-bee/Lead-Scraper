# Benchmark scenario S3 (PLAN.md V00 step 3): discovery speed.
# 2 regions × 2 industries = 4 slices. The Overpass mock answers each slice query after 1.0 s with that
# slice's 10 website-tagged elements (matched by the ISO 3166-2 area selector + an industry keyword of
# the query). Every site has a same-domain email on a linked Impressum. Synthetic data only.
# Recoverable: all 40.
name: S3
request:
  country: Germany
  regions: [Bremen, Hamburg]
  industries: [Logistik, Maschinenbau]
  information: [company_name, company_email, website]
  max_output: 40
env:
  CRAWLER_PER_DOMAIN_DELAY_S: "0.2"
site_latency_s: 0.02
overpass_latency_s: 1.0
recoverable: {default: 40, "off": 40}
decoys: 0
