# Placeholder / dummy email addresses dropped by the extra email pass (PLAN v0.4 V09, CR5).
# Source: the reference project's list (website-email-contact-scraper extract_emails.py) plus
# German/French/Spanish form hints. Matching is EXACT on the local part (or one of the prefixes),
# so real addresses that merely contain a placeholder word survive.
# CR5: every `generic` local of role_emails.yaml (info, kontakt, mail, post, office, …) and
# `protected_locals` below are never placeholders on their own; they are dropped only when the
# domain itself is a placeholder domain.
locals: [youremail, your.email, your_email, your-email, yourname, your.name, your_name, your-name,
         firstname, lastname, firstname.lastname, first.last, username, user.email,
         example, sample, test, dummy, placeholder, foo, bar, todo,
         noreply, no-reply, no.reply, donotreply, do-not-reply,
         mustermann, max.mustermann, maxmustermann, erika.mustermann, vorname.nachname,
         ihre.email, ihre-email, ihrname, votre.email, votre-email, tu.email, tu-email, nombre]
prefixes: [todo-, todo_, todo., example-, test-, sample-]
protected_locals: [email, e-mail, name, user, office]
# Domains match by the whole registered domain (mail.example.com → example.com) or, for entries
# ending in ".*", by the exact first label of the registered domain (example.* → example.de,
# example.co.uk) — never by substring (firma-example.de is not a placeholder domain).
domains: [example.*, domain.com, email.com, yourdomain.com, yourcompany.com, mycompany.com,
          mysite.com, company.com, test.com, test.org, test.net, acme.com, localhost,
          musterfirma.de, mustermann.de]
