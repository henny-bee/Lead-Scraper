# Local multilingual industry catalog (ARCHITECTURE.md §3.2 "industries" row + catalog paragraph).
# Seed data, curated and intentionally small (PLAN.md Q11) — not a full ISIC dump.
#
# `isic`: ISIC Rev.4 sections (letters) and divisions (2 digits) with their official English
#         titles. Every section/division is resolvable by code or by title.
# `profiles`: curated industry concepts mapping one or more ISIC codes to multilingual aliases
#         (what clients type), local keywords (used to build discovery queries, e.g. the Overpass
#         `name~"..."` filter, A§4), negative keywords and OSM tag hints.
# `negative_keywords`: names containing one of these are excluded (Overpass `name!~` + local filter).
# Every mapping records the classification scheme and version (A§3.2: ISIC Rev.5 is in progress).
scheme: ISIC
version: Rev.4

