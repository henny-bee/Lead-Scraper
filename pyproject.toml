[project]
name = "leadscraper"
version = "0.3.0"
description = "Company Lead Scraper API - zero-config v0.3 MVP (in-memory jobs, OSM/Overpass discovery)"
requires-python = ">=3.12"
license = "MIT"
# Runtime dependencies: exhaustive list per PLAN.md §2.1 + Supervisor decision block.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "tenacity>=8.2",
    "aiolimiter>=1.1",
    "protego>=0.3",
    "selectolax>=0.3.21",
    "pycountry>=24.6",
    "babel>=2.15",
    "rapidfuzz>=3.9",
    "google-i18n-address>=3.1",
    "tldextract>=5.3",
    "phonenumbers>=8.13",
    "python-stdnum>=1.20",
    "email-validator>=2.2",
    "dnspython>=2.6",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "aiosmtpd>=1.4",
]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -p no:cacheprovider -m \"not live and not benchmark\""
filterwarnings = [
    # starlette suggests the new `httpx2` package; not in the approved dependency list (PLAN §2.1)
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "live: opt-in live smoke tests against public services (skipped by default)",
    "benchmark: opt-in deterministic fixture benchmark, PLAN.md V00/V17 (skipped by default)",
]
